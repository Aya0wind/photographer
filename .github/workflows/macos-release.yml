name: macOS build and release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      mode:
        description: What to do after building the installers
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - draft
          - publish
      tag:
        description: Optional release tag (defaults to v<app version>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    name: Build macOS installers
    runs-on: macos-15
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      # All signing secrets may be absent: the build then produces an ad-hoc
      # signed DMG and skips verification/notarization instead of failing.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install native build tools
        run: |
          brew update
          brew install cmake libgphoto2

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-installers
          cache-workspace-crates: true
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tauri_version="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          package_version="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          cargo_version="$(awk '/^\[package\]/{section=1; next} section && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' src-tauri/Cargo.toml)"

          if [ -z "$cargo_version" ]; then
            echo 'Could not read the package version from src-tauri/Cargo.toml.' >&2
            exit 1
          fi
          if [ "$tauri_version" != "$package_version" ] || [ "$tauri_version" != "$cargo_version" ]; then
            echo "Version mismatch: tauri=$tauri_version, package=$package_version, cargo=$cargo_version" >&2
            exit 1
          fi

          tag="$(printf '%s' "${INPUT_TAG:-}" | xargs)"
          if [ -z "$tag" ]; then
            tag="v$tauri_version"
          fi
          if ! [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$tag'. Use a semantic version such as v1.2.3." >&2
            exit 1
          fi

          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assemble gphoto bundle
        run: scripts/assemble-gphoto-bundle-macos.sh

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/photo-hub-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build Apple Silicon app and DMG
        run: |
          set -euo pipefail
          # tauri-bundler signs only when APPLE_SIGNING_IDENTITY is set; make
          # sure an empty value from missing secrets reads as "not set".
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE \
              APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run tauri:build:macos -- --target aarch64-apple-darwin

      - name: Verify packaged gphoto runtime and signatures
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          scripts/verify-macos-bundle.sh

      - name: Notarize and staple DMG
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          DMG_DIR: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          set -euo pipefail
          DMG_COUNT="$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' -print | wc -l | tr -d ' ')"
          test "$DMG_COUNT" -eq 1
          DMG_PATH="$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' -print)"
          python3 scripts/notarize-macos.py "$DMG_PATH" "$RUNNER_TEMP/photo-hub-notarization"

      - name: Retain notarization evidence
        if: ${{ always() && env.APPLE_SIGNING_IDENTITY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: photo-hub-notarization-evidence
          path: ${{ runner.temp }}/photo-hub-notarization/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-hub-macos-arm64-${{ steps.metadata.outputs.version }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/dev' && 3 || 14 }}

      - name: Create or update GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'build-only')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#assets[@]} -eq 0 ]; then
            echo 'No installer assets were produced.' >&2
            exit 1
          fi

          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null || true)"
          if [ -n "$release_json" ]; then
            is_draft="$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isDraft"])')"
            if [ "$RELEASE_MODE" = "draft" ] && [ "$is_draft" = "False" ]; then
              echo "Release $RELEASE_TAG is already published and cannot be changed back to a draft." >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

            if [ "$RELEASE_MODE" = "publish" ] && [ "$is_draft" = "True" ]; then
              stability=()
              if [[ "$RELEASE_TAG" =~ -[0-9A-Za-z.]+$ ]]; then
                stability=(--prerelease)
              else
                stability=(--latest)
              fi
              gh release edit "$RELEASE_TAG" --draft=false "${stability[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            args=(release create "$RELEASE_TAG" "${assets[@]}"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "Photo Hub $RELEASE_TAG"
              --generate-notes)
            if [ "$RELEASE_MODE" = "draft" ]; then
              args+=(--draft)
            elif [[ "$RELEASE_TAG" =~ -[0-9A-Za-z.]+$ ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh "${args[@]}"
          fi
