name: Cross-platform regression tests

# 测试只在 main 分支跑（2026-10-07 用户定案）：dev 推送只出构建产物，
# 测试靠本地跑，main 才做发布前的双平台回归。
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cross-platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Assert runner architecture
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-15" ]]; then
            test "$(uname -m)" = "arm64"
          else
            test "$(uname -m)" = "x86_64"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare macOS ONNX Runtime CoreML static library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ort_lib_dir="$(python3 scripts/prepare-ort-macos.py "$RUNNER_TEMP/photographer-ort")"
          test -s "$ort_lib_dir/libonnxruntime.a"
          # -verify_arch treats every following argument as an architecture name.
          lipo "$ort_lib_dir/libonnxruntime.a" -verify_arch arm64
          echo "ORT_LIB_PATH=$ort_lib_dir" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=0" >> "$GITHUB_ENV"

      - name: Cache NASM
        if: runner.os == 'Windows'
        id: nasm_cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NASM
          key: nasm-3.2.0-win-x64-v1

      - name: Install Windows native prerequisites
        if: runner.os == 'Windows' && steps.nasm_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm --version=3.2.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }

      - name: Set up NASM environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nasm = Join-Path $env:ProgramFiles 'NASM\nasm.exe'
          if (-not (Test-Path $nasm)) {
            $nasm = (Get-Command nasm -ErrorAction Stop).Source
          }
          (Split-Path $nasm) >> $env:GITHUB_PATH
          "ASM_NASM=$nasm" >> $env:GITHUB_ENV

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: cross-tests
          cache-workspace-crates: true
          cache-on-failure: false

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust integration tests
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --test album_dirs_test
          --test device_present_test
          --test ipc_folder_test
          --test ipc_import_test
          --test reconcile_test
          --test tethering_test
          --test formats_test
          --test geo_test
          --test schema_migrate_race_test
          --test engine_dedup_test
          --test task_supervisor_test
          --test ai_embed_test
          --test edit_export_test
          --test album_subgroup_physical_test
          --test thumb_test
          --test thumb_queue_test
          --test reference_import_test
          --test assets_query_test
          --test library_delete_test
          --test rating_watch_test
          --test selection_test
          --test settings_test
