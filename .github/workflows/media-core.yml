name: Media core prototype
on:
  push:
    branches: [dev, main]
    paths:
      - '.gitmodules'
      - 'crates/media/**'
      - 'native/rawlab/**'
      - 'src-tauri/examples/rawlab_probe.rs'
      - '.github/workflows/media-core.yml'
      - '.github/actions/rawlab-cache/**'
      - 'scripts/update-rawlab.py'
      - 'scripts/build-rawlab.py'
      - 'scripts/test_rawlab_staging.py'
  pull_request:
    paths: ['.gitmodules', 'crates/media/**', 'native/rawlab/**', '.github/workflows/media-core.yml', '.github/actions/rawlab-cache/**', 'scripts/update-rawlab.py', 'scripts/build-rawlab.py', 'scripts/test_rawlab_staging.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Cached native packaging regressions
        run: python -m unittest discover -s scripts -p test_rawlab_staging.py
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/media -> target
          shared-key: media-core-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: Build or restore pinned native RAW bridge
        uses: ./.github/actions/rawlab-cache
        with:
          build-directory: native/rawlab/build
          testing: 'ON'
      - name: Native ABI failure regressions
        run: ctest --test-dir native/rawlab/build -C Release --output-on-failure
      - name: Rust color and ABI regressions
        if: runner.os != 'Windows'
        run: |
          case "${{ runner.os }}" in
            Windows) export PHOTOGRAPHER_RAW_BRIDGE="$GITHUB_WORKSPACE/native/rawlab/build/photographer_raw.dll" ;;
            macOS) export PHOTOGRAPHER_RAW_BRIDGE="$GITHUB_WORKSPACE/native/rawlab/build/libphotographer_raw.dylib" ;;
            Linux) export PHOTOGRAPHER_RAW_BRIDGE="$GITHUB_WORKSPACE/native/rawlab/build/libphotographer_raw.so" ;;
          esac
          test -f "$PHOTOGRAPHER_RAW_BRIDGE"
          cargo test --manifest-path crates/media/Cargo.toml --locked
      - name: Rust color and ABI regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Git Bash ships a different link.exe. Bind Rust to the MSVC linker.
          $compiler = (Get-Command cl.exe -CommandType Application -ErrorAction Stop).Source
          $msvcBin = Split-Path -Parent $compiler
          $env:PATH = "$msvcBin;$env:PATH"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $msvcBin 'link.exe'
          $env:PHOTOGRAPHER_RAW_BRIDGE = Join-Path $env:GITHUB_WORKSPACE 'native/rawlab/build/photographer_raw.dll'
          if (!(Test-Path -LiteralPath $env:PHOTOGRAPHER_RAW_BRIDGE -PathType Leaf)) { throw 'RAW bridge missing' }
          cargo test --manifest-path crates/media/Cargo.toml --locked
          exit $LASTEXITCODE
