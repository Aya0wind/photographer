[package]
name = "smart-photo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This only seems to be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_photo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 缩略图服务（M3 提前）：JPG/PNG/WEBP/BMP/GIF/TIFF 解码 + 缩放 + JPEG q80 落盘
image = "0.25"
# JPEG 缩放解码（TJSCALED：DCT 域直出小图，61MP 全量 1-3s → ~100ms）；
# vendored 自带 libjpeg-turbo 源码构建（需 cmake，已验证本机可用）；
# "image" feature 直接解到 image::RgbImage。
turbojpeg = { version = "1", features = ["image"] }

tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# M1：事件总线 / 数据库 / 哈希 / 元数据 / 设备
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
walkdir = "2"
kamadak-exif = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_PortableDevices",
  "Win32_Devices_Enumeration",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# 开发阶段（用户 2026-09-19）：关 LTO/降 codegen 并行度换编译速度；
# 发布打包前（M8）恢复 codegen-units=1 + lto=true
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
