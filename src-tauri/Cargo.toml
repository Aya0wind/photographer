[package]
name = "smart-photo"
version = "0.1.0-alpha"
license = "GPL-3.0-or-later"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This only seems to be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_photo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
num_cpus = "1.17"
# 缩略图服务（M3 提前）：JPG/PNG/WEBP/BMP/GIF/TIFF 解码 + 缩放 + JPEG q80 落盘
image = "0.25"
# 编辑引擎：直接依赖上游公开 API；全部 crate 固定同一提交，不引入 egui/app。
photocraft-engine = { git = "https://github.com/storytold/photocraft.git", rev = "3955bf4f1911a69ea08947634b3e2b459feece2f" }
photocraft-compose = { git = "https://github.com/storytold/photocraft.git", rev = "3955bf4f1911a69ea08947634b3e2b459feece2f" }
# 扩展图片格式解码（2026-09-29 格式支持批次）：全部纯 Rust/无 C 构建负担
heif-oxide = "0.1"
jxl-oxide = { version = "0.12", features = ["image"] }
avif-decode = "3"
# JPEG 缩放解码（TJSCALED：DCT 域直出小图，61MP 全量 1-3s → ~100ms）；
# vendored 自带 libjpeg-turbo 源码构建（需 cmake，已验证本机可用）；
# "image" feature 直接解到 image::RgbImage。
turbojpeg = { version = "1", features = ["image"] }
# RAW 完整显影（查看器先显示内嵌 JPEG，后台生成 2048px 高质量 JPEG 后替换）。
rawler = "=0.8.0"
# 地图模块（2026-09-29 拍摄地图）：多边形点包含 / centroid、R-tree 空间预筛
geo = "0.29"
geo-types = { version = "0.7", features = ["serde"] }
bincode = "1"
rstar = "0.12"

tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

# M1：事件总线 / 数据库 / 哈希 / 元数据 / 设备
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libloading = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
# M4 AI 推理：ONNX Runtime（directml feature = 构建期下载含 DML 的 ms
# 预编译库；EP 选择在运行时按 settings.ai.use_gpu / env 覆盖——见
# platform/windows/runtime.rs；DirectML feature 仅在 Windows 启用）
ort = { version = "2.0.0-rc.13" }
# SigLIP2 文本分词（HuggingFace 官方 Rust，加载 tokenizer.json WordPiece 词表）
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# HNSW 向量索引（768 维 cos 距离，dbDir/vectors.usearch）
usearch = "=2.19.23" # 2.20+ 引入 numkong 多目标分发，MSVC 编译失败（icelake/turin 探针 #error）
# M4 模型在线下载：阻塞式 HTTP(S) 客户端（rustls；supervisor 线程内用，
# Content-Range 断点续传 + 流式写 .part）
ureq = "2"
walkdir = "2"
kamadak-exif = "0.6"
# M5 XMP 边车（LR 互通）：quick-xml 只做读取侧的结构化解析；改写侧用
# 字符串外科手术（未触字段逐字节保留，绝不整档重序列化——防丢 LR 数据）
quick-xml = "0.42"
# 阶段 D 基础编辑：文字栅格化（运行时加载系统字体，不捆绑字体文件；
# MIT OR Apache-2.0，许可宽松）
ab_glyph = "0.2"
# 阶段 D 导出元数据：JPEG 段级改写（只替换 APP1 段，图像数据零重编码；
# MIT，许可宽松）
img-parts = "0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }

windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_PortableDevices",
  "Win32_Devices_Enumeration",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_LibraryLoader",
] }
# windows::core::implement 宏展开引用 windows_core:: 路径，需具名直依赖。
# 与 windows 0.61 同版本同代码（其本身依赖 windows-core），零新增编译产物。
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# 开发阶段（用户 2026-09-19）：关 LTO/降 codegen 并行度换编译速度；
# 发布打包前（M8）恢复 codegen-units=1 + lto=true
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
