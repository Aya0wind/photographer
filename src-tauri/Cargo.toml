[package]
name = "smart-photo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This only seems to be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_photo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# M1：事件总线 / 数据库 / 哈希 / 元数据 / 设备
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
walkdir = "2"
kamadak-exif = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_PortableDevices",
  "Win32_Devices_Enumeration",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
